[pytest]
asyncio_mode = auto
; A single event loop for the whole test session, not one per test
; function. Needed because app/redis_client.py creates one shared,
; module-level async Redis client at import time (matching how it runs in
; the real app) - a per-test loop would try to reuse that client on a
; different event loop each test and fail with "Event loop is closed".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    network: tests that make a real network call (not used in this project, kept for consistency with other repos)
